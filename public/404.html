<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CampusConnect - Page Redirect</title>
    <script type="text/javascript">
      // Single Page Application redirect script for GitHub Pages
      // If deployed at https://<username>.github.io/<repo-name>/, pathSegmentsToKeep is 1.
      // If deployed at custom domain or root https://<username>.github.io/, pathSegmentsToKeep is 0.
      var isSubpath = window.location.pathname.split('/').filter(Boolean).length > 0 &&
                      window.location.hostname.endsWith('github.io');
      var pathSegmentsToKeep = isSubpath ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to CampusConnect...</p>
  </body>
</html>
